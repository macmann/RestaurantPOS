services:
  - type: web
    name: sym-pos
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run render:start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: CLOUD
      # Set to the public Render service origin (never the internal bind URL).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SYNC_API_TOKEN
        generateValue: true
      - key: POS_REPOSITORY_BACKEND
        value: postgres
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        sync: false
